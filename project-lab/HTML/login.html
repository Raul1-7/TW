<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="glass-login-container">
        
        <div class="login-visual">
            <h2>Welcome!</h2>
            <p>Connect in order to access the platform.</p>
        </div>
        
        <div class="login-form-wrapper">
            <h3>Authentication</h3>
            <form action="home.html">
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Parolă" required>
                </div>
                
                <div class="form-options">
                    <label><input type="checkbox"> Don't forget me</label>
                    <a href="#" class="forgot-pass">Do you forgot your password?</a>
                </div>

                <button type="submit" class="modern-btn">Login to account</button>
            </form>
            <p class="register-link">
                Don't you have an account? <a href="register.html">Registrate now</a>
            </p>
        </div>
        
    </div>
</body>
</html>
