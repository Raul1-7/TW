<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="glass-login-container">
        
        <div class="login-visual">
            <h2>Welcome!</h2>
            <p>Connect in order to access the platform.</p>
        </div>
        
        <div class="login-form-wrapper">
            <h3>Authentication</h3>
            <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Parolă" required>
            </div>
            
            <div class="form-options">
                <label><input type="checkbox"> Ține-mă minte</label>
                <a href="#" class="forgot-pass">Ai uitat parola?</a>
            </div>

            <button type="submit" class="modern-btn">Intră în cont</button>
        </form>
        
            <p class="register-link">
                Don't you have an account? <a href="register.html">Registrate now</a>
            </p>
        </div>
    </div>
    <script src="../JS/login_js.js"></script>
</body>
</html>
