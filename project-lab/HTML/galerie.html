<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Foto - TW</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/galerie.css">
    <link rel="stylesheet" href="../CSS/cursor.css">
</head>
<body class="center-content">

    <div class="glass-gallery-container">
        <div class="gallery-header">
            <a href="home.html" class="back-link">← Înapoi la Acasă</a>
            <h2>Galerie Foto Interactivă</h2>
        </div>

    
        <div class="carousel-container">
            <div class="carousel-view">
                <img id="carousel-image" src="../MEDIA/g1.jpeg" alt="Carusel">
            </div>

            <div class="carousel-controls">
                <button id="prevBtn" class="control-btn">‹ Înapoi</button>
                <span id="imageCounter" class="image-counter">1 / 3</span>
                <button id="nextBtn" class="control-btn">Înainte ›</button>
            </div>
        </div>
    </div>

    <script src="../JS/cursor.js"></script>
    <script src="../JS/galerie.js"></script>

</html>
