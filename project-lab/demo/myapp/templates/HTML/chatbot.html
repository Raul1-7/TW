{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot TW</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/chatbot_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>
<body class="center-content">
    
    <div class="glass-chatbot-container">
        <div class="chatbot-header">
            <a href="{% url 'home' %}" class="back-link">← Înapoi la Acasă</a>
            <h2>Asistent Proiect TW</h2>
        </div>
        
        <div class="chat-container" id="chat-container"></div>
        
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Răspunde cu a, b sau c..." autocomplete="off">
            <button type="submit" class="modern-btn">Trimite</button>
        </form>
    </div>

    <script src="{% static 'JS/cursor.js' %}"></script>
    <script src="{% static 'JS/chatbot_js.js' %}"></script>
</body>
</html>
