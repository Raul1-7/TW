{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Foto - TW</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/galerie.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>
<body class="center-content">

    <div class="glass-gallery-container">
        <div class="gallery-header">
            <a href="{% url 'home' %}" class="back-link">← Înapoi la Acasă</a>
            <h2>Galerie Foto Interactivă</h2>
        </div>

        <div class="carousel-container">
            <div class="carousel-view">
                <img id="carousel-image" src="{% static 'MEDIA/g1.jpg' %}" alt="Carusel">
            </div>

            <div class="carousel-controls">
                <button id="prevBtn" class="control-btn">‹ Înapoi</button>
                <span id="imageCounter" class="image-counter">1 / 3</span>
                <button id="nextBtn" class="control-btn">Înainte ›</button>
            </div>
        </div>
    </div>

    <script src="{% static 'JS/cursor.js' %}"></script>
    <script src="{% static 'JS/galerie.js' %}"></script>
</body>
</html>
